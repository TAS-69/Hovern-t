sourceSets.main.java.srcDir rootProject.file('minecraft/src/main/java')
sourceSets.main.java.srcDir rootProject.file(rootProject.modern ? 'minecraft/src/registry/java' : 'minecraft/src/legacy/java')
sourceSets.main.resources.srcDir rootProject.file('minecraft/src/main/resources')

def generated = layout.buildDirectory.dir('generated/hovernt')
sourceSets.main.java.srcDir generated
tasks.register('generateCompat', Copy) {
    from rootProject.file('minecraft/templates')
    into generated
    inputs.property 'modern', rootProject.modern
    inputs.property 'compatibility', rootProject.hasProperty('compatibilityProfileFile')
    expand graphics: rootProject.modern ? 'GuiGraphicsExtractor' : 'GuiGraphics',
           labelsMethod: rootProject.modern ? 'extractLabels' : 'renderLabels',
           bgMethod: rootProject.modern ? 'extractBackground' : 'renderBg',
           contentsMethod: rootProject.modern ? 'extractContents' : 'render',
           bgArguments: rootProject.modern ? 'int mouseX, int mouseY, float partialTick' : 'float partialTick, int mouseX, int mouseY',
           resourceType: rootProject.modern ? 'Identifier' : 'ResourceLocation',
           resourceCreate: rootProject.modern ? 'Identifier.fromNamespaceAndPath("hovernt", "textures/gui/sidebar.png")' : 'new ResourceLocation("hovernt", "textures/gui/sidebar.png")',
           blitCall: rootProject.modern ? 'graphics.blit(net.minecraft.client.renderer.RenderPipelines.GUI_TEXTURED, texture, x, y, u, v, width, height, sourceWidth, sourceHeight, textureWidth, textureHeight)' : 'graphics.blit(texture, x, y, width, height, u, v, sourceWidth, sourceHeight, textureWidth, textureHeight)',
           outsideArgs: rootProject.modern ? 'double mouseX, double mouseY, int left, int top' : 'double mouseX, double mouseY, int left, int top, int button',
           outsideCall: rootProject.modern ? 'mouseX, mouseY, left, top' : 'mouseX, mouseY, left, top, button',
           initArgs: rootProject.modern ? 'width, height' : 'minecraft, width, height',
           observeLabel: rootProject.hasProperty('compatibilityProfileFile') ? 'dev.tas69.hovernt.compat.CompatibilityFixture.rendered(label);' : '',
           drawText: rootProject.modern ? 'text' : 'drawString',
           push: rootProject.modern ? 'pushMatrix' : 'pushPose',
           pop: rootProject.modern ? 'popMatrix' : 'popPose',
           translateArgs: rootProject.modern ? 'x, y' : 'x, y, 0',
           scaleArgs: rootProject.modern ? 'SCALE, SCALE' : 'SCALE, SCALE, 1',
           scissor: rootProject.modern ? '6, 0, panelWidth - 3, 20' : 'left + x + 6, top + y, left - 3, top + y + 20',
           modPackage: rootProject.modern ? 'net.neoforged.fml.common' : 'net.minecraftforge.fml.common'
    if (project.name == 'fabric') exclude '**/HoverntNeoForge.java'
}
compileJava.dependsOn 'generateCompat'
tasks.named('sourcesJar') { dependsOn 'generateCompat' }

sourceSets {
    smoke {
        java.srcDir rootProject.file(rootProject.modern ? 'tests/src/registry/java' : 'tests/src/legacy/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
if (rootProject.hasProperty('acceptance')) {
    if (rootProject.modern) throw new GradleException('The interactive acceptance fixture currently targets 1.20.1.')
    sourceSets.main.java.srcDir rootProject.file('tests/acceptance/java')
    sourceSets.main.resources.srcDir rootProject.file('tests/acceptance/resources')
    if (rootProject.hasProperty('compatibilityProfileFile')) sourceSets.main.java.srcDir rootProject.file('tests/compatibility/java')
}
tasks.named('processResources') {
    from(rootProject.file('hovernt_logo.png')) {
        into 'assets/hovernt'
        rename { 'icon.png' }
    }
    inputs.property 'acceptance', rootProject.hasProperty('acceptance')
    inputs.property 'gameJava', rootProject.gameJava
    inputs.property 'compatibility', rootProject.hasProperty('compatibilityProfileFile')
    inputs.property 'packFormat', rootProject.targets[rootProject.targetMc].packFormat
    doLast {
        def config = new groovy.json.JsonSlurper().parse(rootProject.file('minecraft/src/main/resources/hovernt.mixins.json'))
        config.compatibilityLevel = "JAVA_${rootProject.gameJava}"
        if (rootProject.modern) config.remove('refmap')
        if (rootProject.hasProperty('acceptance')) config.client.addAll([rootProject.hasProperty('compatibilityProfileFile') ? 'CompatibilityClientMixin' : 'MinecraftSmokeMixin', 'ContainerSmokeMixin'])
        new File(destinationDir, 'hovernt.mixins.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        def format = rootProject.targets[rootProject.targetMc].packFormat
        def pack = rootProject.modern ? [description: "Hovern't resources", min_format: format, max_format: format] : [description: "Hovern't resources", pack_format: format]
        new File(destinationDir, 'pack.mcmeta').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([pack: pack]))
    }
}
tasks.register('smokeBooks', JavaExec) {
    dependsOn 'smokeClasses'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'dev.tas69.hovernt.BookNamesSmoke'
}
