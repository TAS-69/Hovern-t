pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = "Hovern't"
def platform = providers.gradleProperty('platform').getOrElse('all')
if (!(platform in ['all', 'fabric', 'neoforge'])) throw new GradleException("Unknown platform: $platform")
if (platform in ['all', 'fabric']) include 'fabric'
if (platform in ['all', 'neoforge']) include 'neoforge'
