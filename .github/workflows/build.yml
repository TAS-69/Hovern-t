name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft: ['1.20.1', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew -Pmc=${{ matrix.minecraft }} collectJars --console=plain
      - run: python3 tests/verify_jars.py dist/1.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: hovernt-${{ matrix.minecraft }}
          path: dist/1.1.0/*.jar

